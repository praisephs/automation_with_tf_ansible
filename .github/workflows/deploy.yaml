name: Terraform + Ansible CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create .env file for Terraform variables
        run: |
          echo "Start generating env file..."
          touch .env
          echo TF_VAR_do_token="${{ secrets.DO_TOKEN }}" >> .env
          echo TF_VAR_ssh_key_name="${{ secrets.SSH_KEY_NAME }}" >> .env

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: |
          source .env
          terraform init

      - name: Terraform Plan
        run: |
          source .env
          terraform plan

      - name: Terraform Apply
        run: |
          source .env
          terraform apply -auto-approve

      - name: Ansible Playbook - Install Nginx + SSL
        run: |
          sudo apt update && sudo apt install -y ansible
          ansible-playbook -i inventory.ini install_nginx.yaml

      - name: Print Deployment URL
        run: |
          echo "✅ Deployed! Access the app at: https://uyi.cerebro.ng"
